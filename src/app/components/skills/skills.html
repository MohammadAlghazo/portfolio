<section id="skills" class="section" aria-labelledby="expertise-title">
  <div class="container">
    <div class="expertise-heading">
      <div>
        <span class="section-label">Expertise, applied</span>
        <h2 id="expertise-title" class="section-title">
          The right tools<br /><span class="accent">A working outcome</span>
        </h2>
      </div>
      <p class="section-intro">
        A stack matters most when it solves the problem in front of it. Here is where I put mine to
        work
      </p>
    </div>
    <div class="capability-list">
      @for (item of capabilities; track item.title) {
        <article class="capability">
          <h3>{{ item.title }}</h3>
          <div>
            <p>{{ item.description }}</p>
            <span class="capability-tools">{{ item.tools }}</span>
          </div>
          <a [routerLink]="['/projects', item.slug]" class="text-link"
            >See {{ item.example }} <span aria-hidden="true">↗</span></a
          >
        </article>
      }
    </div>
  </div>
</section>
