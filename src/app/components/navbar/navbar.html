<header class="navbar">
  <div class="container nav-inner">
    <a routerLink="/" fragment="home" class="nav-logo" aria-label="Mohammad Alghazo, home"
      >M<span>.</span>A</a
    >
    <nav class="nav-links" aria-label="Main navigation">
      @for (link of links; track link.fragment) {
        <a routerLink="/" [fragment]="link.fragment">{{ link.label }}</a>
      }
    </nav>
    <div class="nav-right">
      <button
        type="button"
        class="theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="isDark ? 'Switch to light theme' : 'Switch to dark theme'"
        [attr.aria-pressed]="isDark"
        [title]="isDark ? 'Switch to light theme' : 'Switch to dark theme'"
      >
        @if (isDark) {
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"
            />
          </svg>
        } @else {
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <path d="M20.5 14a8.6 8.6 0 0 1-10.5-10.5A8.7 8.7 0 1 0 20.5 14Z" />
          </svg>
        }
      </button>
      <a routerLink="/" fragment="contact" class="nav-cta"
        >Let's talk <span aria-hidden="true">↗</span></a
      >
      <button
        #menuToggle
        type="button"
        class="menu-toggle"
        (click)="menuOpen = !menuOpen"
        [attr.aria-expanded]="menuOpen"
        aria-controls="mobile-navigation"
        [attr.aria-label]="menuOpen ? 'Close navigation' : 'Open navigation'"
      >
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          aria-hidden="true"
        >
          @if (menuOpen) {
            <path d="m6 6 12 12M6 18 18 6" />
          } @else {
            <path d="M3 8h18M3 16h18" />
          }
        </svg>
      </button>
    </div>
  </div>
  @if (menuOpen) {
    <nav class="mobile-menu" id="mobile-navigation" aria-label="Mobile navigation">
      @for (link of links; track link.fragment) {
        <a routerLink="/" [fragment]="link.fragment" (click)="menuOpen = false"
          >{{ link.label }} <span aria-hidden="true">↗</span></a
        >
      }
      <a routerLink="/" fragment="contact" (click)="menuOpen = false"
        >Let's talk <span aria-hidden="true">↗</span></a
      >
    </nav>
  }
</header>
